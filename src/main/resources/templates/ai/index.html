<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>AIデータ照会 | 社員管理システム</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: navigation}"></header>
<main class="container page-container narrow-container">
  <div class="page-heading"><p class="eyebrow">AI DATA INQUIRY</p><h1>AIデータ照会</h1><p class="text-secondary mb-0">社員情報について日本語で質問してください。</p></div>
  <div class="alert alert-info" th:unless="${aiAvailable}">AI機能は現在利用できません。管理者にお問い合わせください。</div>
  <section class="card border-0 shadow-sm mb-4">
    <div class="card-body p-4">
      <h2 class="h6">質問例</h2>
      <div class="d-flex flex-wrap gap-2 mb-4">
        <button class="btn btn-sm btn-outline-secondary example-question" type="button">現在の在籍社員数を教えてください</button>
        <button class="btn btn-sm btn-outline-secondary example-question" type="button">開発部の在籍社員は何人ですか？</button>
        <button class="btn btn-sm btn-outline-secondary example-question" type="button">2025年に入社した開発部の社員は何人ですか？</button>
        <button class="btn btn-sm btn-outline-secondary example-question" type="button">EMP0001の所属部署を教えてください</button>
        <button class="btn btn-sm btn-outline-secondary example-question" type="button">テスト社員01を検索してください</button>
      </div>
      <form id="ai-query-form">
        <label for="question" class="form-label">質問（500文字以内）</label>
        <textarea id="question" class="form-control" rows="3" maxlength="500" required></textarea>
        <div class="d-flex align-items-center gap-3 mt-3"><button id="ask-button" class="btn btn-primary" type="submit" th:disabled="${!aiAvailable}">質問する</button><span id="query-status" class="small text-secondary" aria-live="polite"></span></div>
      </form>
    </div>
  </section>
  <section id="answer-panel" class="card border-0 shadow-sm" hidden>
    <div class="card-body p-4"><h2 class="h6">回答</h2><p id="answer-text" class="mb-3 answer-text"></p><p id="answer-source" class="small text-secondary mb-0"></p></div>
  </section>
</main>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/ai.js}"></script>
</body>
</html>

<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ダッシュボード | 社員管理システム</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: navigation}"></header>
<main class="container page-container">
  <div class="page-heading">
    <p class="eyebrow">OVERVIEW</p>
    <h1>ダッシュボード</h1>
    <p class="text-secondary mb-0">社員と部署の登録状況を確認できます。</p>
  </div>
  <section class="row g-3 mb-4">
    <div class="col-12 col-sm-6 col-xl-3"><div class="stat-card"><span>登録社員数</span><strong th:text="${summary.registeredEmployees}">0</strong><small>未削除の全社員</small></div></div>
    <div class="col-12 col-sm-6 col-xl-3"><div class="stat-card"><span>在籍社員数</span><strong th:text="${summary.activeEmployees}">0</strong><small>ACTIVE の社員</small></div></div>
    <div class="col-12 col-sm-6 col-xl-3"><div class="stat-card"><span>部署数</span><strong th:text="${summary.departmentCount}">0</strong><small>登録中の部署</small></div></div>
    <div class="col-12 col-sm-6 col-xl-3"><div class="stat-card"><span th:text="${summary.year} + '年の入社人数'">今年の入社人数</span><strong th:text="${summary.hiresThisYear}">0</strong><small>未削除の社員</small></div></div>
  </section>
  <section class="card border-0 shadow-sm">
    <div class="card-header bg-white py-3"><h2 class="h5 mb-0">部署別の在籍社員数</h2></div>
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead><tr><th>部署名</th><th>説明</th><th class="text-end">在籍社員数</th></tr></thead>
        <tbody>
        <tr th:each="department : ${summary.departments}">
          <td class="fw-semibold" th:text="${department.name}">開発部</td>
          <td class="text-secondary" th:text="${department.description}">説明</td>
          <td class="text-end" th:text="${department.employeeCount}">0</td>
        </tr>
        <tr th:if="${#lists.isEmpty(summary.departments)}"><td colspan="3" class="text-center text-secondary py-4">部署が登録されていません。</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>

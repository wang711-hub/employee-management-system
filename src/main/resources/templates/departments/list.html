<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>部署管理 | 社員管理システム</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header th:replace="~{fragments/nav :: navigation}"></header>
<main class="container page-container">
  <div class="page-heading"><p class="eyebrow">DEPARTMENTS</p><h1>部署管理</h1><p class="text-secondary mb-0">社員が所属している部署は削除できません。</p></div>
  <div class="alert alert-success" th:if="${notice}" th:text="${notice}"></div><div class="alert alert-warning" th:if="${errorMessage}" th:text="${errorMessage}"></div>
  <section class="card border-0 shadow-sm mb-4" th:if="${isAdmin}"><div class="card-body">
    <h2 class="h5">部署の新規登録</h2>
    <form th:action="@{/departments}" th:object="${departmentForm}" method="post" class="row g-3 align-items-end">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="col-12 col-lg-4"><label for="newDepartmentName" class="form-label">部署名</label><input id="newDepartmentName" th:field="*{name}" class="form-control" maxlength="100"><div class="field-error" th:errors="*{name}"></div></div>
      <div class="col-12 col-lg-6"><label for="newDepartmentDescription" class="form-label">説明</label><input id="newDepartmentDescription" th:field="*{description}" class="form-control" maxlength="255"><div class="field-error" th:errors="*{description}"></div></div>
      <div class="col-12 col-lg-2"><button class="btn btn-primary w-100" type="submit">登録</button></div>
    </form>
  </div></section>
  <section class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0">
    <thead><tr><th>ID</th><th>部署名</th><th>説明</th><th>社員数</th><th th:if="${isAdmin}">操作</th></tr></thead>
    <tbody>
    <tr th:each="department : ${departments}">
      <td th:text="${department.id}">1</td>
      <td th:if="${isAdmin}"><form th:id="|department-form-${department.id}|" th:action="@{/departments/{id}/edit(id=${department.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form><input class="form-control form-control-sm" th:attr="form=|department-form-${department.id}|" name="name" th:value="${department.name}" maxlength="100" aria-label="部署名"></td>
      <td th:unless="${isAdmin}" th:text="${department.name}">開発部</td>
      <td th:if="${isAdmin}"><input class="form-control form-control-sm" th:attr="form=|department-form-${department.id}|" name="description" th:value="${department.description}" maxlength="255" aria-label="説明"></td>
      <td th:unless="${isAdmin}" th:text="${department.description}">説明</td>
      <td th:text="${department.employeeCount}">0</td>
      <td th:if="${isAdmin}" class="text-nowrap"><button class="btn btn-sm btn-outline-primary" th:attr="form=|department-form-${department.id}|" type="submit">保存</button><form class="d-inline" th:action="@{/departments/{id}/delete(id=${department.id})}" method="post" onsubmit="return confirm('この部署を削除しますか？');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger" type="submit">削除</button></form></td>
    </tr>
    <tr th:if="${#lists.isEmpty(departments)}"><td colspan="5" class="text-center text-secondary py-4">部署が登録されていません。</td></tr>
    </tbody>
  </table></div></section>
</main>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>

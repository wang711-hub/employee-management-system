<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>社員詳細 | 社員管理システム</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header th:replace="~{fragments/nav :: navigation}"></header>
<main class="container page-container narrow-container">
  <div class="page-heading d-flex justify-content-between align-items-end gap-3"><div><p class="eyebrow">EMPLOYEE PROFILE</p><h1>社員詳細</h1></div><div class="d-flex gap-2" th:if="${isAdmin}"><a class="btn btn-outline-primary" th:href="@{/employees/{id}/edit(id=${employee.id})}">編集</a><form th:action="@{/employees/{id}/delete(id=${employee.id})}" method="post" onsubmit="return confirm('この社員を削除しますか？');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-outline-danger">削除</button></form></div></div>
  <div class="alert alert-success" th:if="${notice}" th:text="${notice}"></div>
  <section class="card border-0 shadow-sm"><div class="card-body p-4">
    <dl class="row detail-list mb-0">
      <dt class="col-sm-4">社員番号</dt><dd class="col-sm-8" th:text="${employee.employeeCode}">EMP0001</dd>
      <dt class="col-sm-4">氏名</dt><dd class="col-sm-8" th:text="${employee.fullName}">テスト社員01</dd>
      <dt class="col-sm-4">所属部署</dt><dd class="col-sm-8" th:text="${employee.department.name}">開発部</dd>
      <dt class="col-sm-4">役職</dt><dd class="col-sm-8" th:text="${employee.jobTitle}">エンジニア</dd>
      <dt class="col-sm-4">入社日</dt><dd class="col-sm-8" th:text="${#temporals.format(employee.hireDate, 'yyyy-MM-dd')}">2025-04-01</dd>
      <dt class="col-sm-4">在籍状況</dt><dd class="col-sm-8" th:text="${employee.status.label}">在籍</dd>
      <dt class="col-sm-4">メールアドレス</dt><dd class="col-sm-8" th:text="${employee.email == null ? '未登録' : employee.email}">未登録</dd>
      <dt class="col-sm-4">電話番号</dt><dd class="col-sm-8" th:text="${employee.phone == null ? '未登録' : employee.phone}">未登録</dd>
    </dl>
  </div></section>
  <a class="btn btn-link px-0 mt-3" th:href="@{/employees}">社員一覧へ戻る</a>
</main>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>

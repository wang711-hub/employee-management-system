<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${editing ? '社員編集' : '社員新規登録'} + ' | 社員管理システム'">社員登録</title><link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header th:replace="~{fragments/nav :: navigation}"></header>
<main class="container page-container narrow-container">
  <div class="page-heading"><p class="eyebrow">EMPLOYEE FORM</p><h1 th:text="${editing ? '社員情報の編集' : '社員の新規登録'}">社員登録</h1></div>
  <section class="card border-0 shadow-sm"><div class="card-body p-4">
    <form th:object="${employeeForm}" th:action="${editing} ? @{/employees/{id}/edit(id=${employeeId})} : @{/employees}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}"><p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div>
      <div class="row g-3">
        <div class="col-12 col-md-6"><label for="employeeCode" class="form-label">社員番号 <span class="required-mark">*</span></label><input id="employeeCode" th:field="*{employeeCode}" class="form-control" th:readonly="${editing}" maxlength="20" required><div class="field-error" th:errors="*{employeeCode}"></div></div>
        <div class="col-12 col-md-6"><label for="fullName" class="form-label">氏名 <span class="required-mark">*</span></label><input id="fullName" th:field="*{fullName}" class="form-control" maxlength="100" required><div class="field-error" th:errors="*{fullName}"></div></div>
        <div class="col-12 col-md-6"><label for="email" class="form-label">メールアドレス</label><input id="email" th:field="*{email}" type="email" class="form-control" maxlength="150"><div class="field-error" th:errors="*{email}"></div></div>
        <div class="col-12 col-md-6"><label for="phone" class="form-label">電話番号</label><input id="phone" th:field="*{phone}" class="form-control" maxlength="30"><div class="field-error" th:errors="*{phone}"></div></div>
        <div class="col-12 col-md-6"><label for="departmentId" class="form-label">所属部署 <span class="required-mark">*</span></label><select id="departmentId" th:field="*{departmentId}" class="form-select" required><option value="">選択してください</option><option th:each="department : ${departments}" th:value="${department.id}" th:text="${department.name}"></option></select><div class="field-error" th:errors="*{departmentId}"></div></div>
        <div class="col-12 col-md-6"><label for="jobTitle" class="form-label">役職 <span class="required-mark">*</span></label><input id="jobTitle" th:field="*{jobTitle}" class="form-control" maxlength="100" required><div class="field-error" th:errors="*{jobTitle}"></div></div>
        <div class="col-12 col-md-6"><label for="hireDate" class="form-label">入社日 <span class="required-mark">*</span></label><input id="hireDate" th:field="*{hireDate}" type="date" class="form-control" required><div class="field-error" th:errors="*{hireDate}"></div></div>
        <div class="col-12 col-md-6"><label for="status" class="form-label">在籍状況 <span class="required-mark">*</span></label><select id="status" th:field="*{status}" class="form-select" required><option value="">選択してください</option><option th:each="statusOption : ${statuses}" th:value="${statusOption.name()}" th:text="${statusOption.label}"></option></select><div class="field-error" th:errors="*{status}"></div></div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" th:href="${editing} ? @{/employees/{id}(id=${employeeId})} : @{/employees}">キャンセル</a><button type="submit" class="btn btn-primary">保存</button></div>
    </form>
  </div></section>
</main>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>

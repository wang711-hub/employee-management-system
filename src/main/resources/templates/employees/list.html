<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社員一覧 | 社員管理システム</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: navigation}"></header>
<main class="container page-container">
  <div class="page-heading d-flex flex-wrap justify-content-between align-items-end gap-3">
    <div><p class="eyebrow">EMPLOYEES</p><h1>社員一覧</h1><p class="text-secondary mb-0">検索条件に一致する社員を表示します。</p></div>
    <a class="btn btn-primary" th:if="${isAdmin}" th:href="@{/employees/new}">新規登録</a>
  </div>
  <div class="alert alert-success" th:if="${notice}" th:text="${notice}"></div>
  <div class="alert alert-warning" th:if="${filterError}" th:text="${filterError}"></div>
  <section class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <form method="get" th:action="@{/employees}" class="row g-3 align-items-end">
        <div class="col-12 col-lg-5"><label for="keyword" class="form-label">氏名・社員番号</label><input id="keyword" name="keyword" maxlength="100" class="form-control" th:value="${keyword}" placeholder="例：テスト社員01 / EMP0001"></div>
        <div class="col-12 col-md-6 col-lg-3"><label for="departmentId" class="form-label">部署</label><select id="departmentId" name="departmentId" class="form-select"><option value="">すべて</option><option th:each="department : ${departments}" th:value="${department.id}" th:text="${department.name}" th:selected="${department.id == departmentId}"></option></select></div>
        <div class="col-12 col-md-6 col-lg-2"><label for="status" class="form-label">在籍状況</label><select id="status" name="status" class="form-select"><option value="">すべて</option><option th:each="statusOption : ${statuses}" th:value="${statusOption.name()}" th:text="${statusOption.label}" th:selected="${statusOption.name() == selectedStatus}"></option></select></div>
        <div class="col-12 col-lg-2 d-flex gap-2"><button type="submit" class="btn btn-primary flex-grow-1">検索</button><a class="btn btn-outline-secondary" th:href="@{/employees}">リセット</a></div>
      </form>
    </div>
  </section>
  <section class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>社員番号</th><th>氏名</th><th>部署</th><th>役職</th><th>入社日</th><th>在籍状況</th><th>操作</th></tr></thead>
        <tbody>
        <tr th:each="employee : ${employees.content}">
          <td class="text-nowrap" th:text="${employee.employeeCode}">EMP0001</td>
          <td><a class="employee-link" th:href="@{/employees/{id}(id=${employee.id})}" th:text="${employee.fullName}">テスト社員01</a></td>
          <td th:text="${employee.department.name}">開発部</td><td th:text="${employee.jobTitle}">エンジニア</td>
          <td class="text-nowrap" th:text="${#temporals.format(employee.hireDate, 'yyyy-MM-dd')}">2025-04-01</td>
          <td><span class="badge" th:classappend="${employee.status.name() == 'ACTIVE' ? ' text-bg-success' : (employee.status.name() == 'LEAVE' ? ' text-bg-warning' : ' text-bg-secondary')}" th:text="${employee.status.label}">在籍</span></td>
          <td><a class="btn btn-sm btn-outline-primary" th:href="@{/employees/{id}(id=${employee.id})}">詳細</a></td>
        </tr>
        <tr th:if="${employees.empty}"><td colspan="7" class="text-center text-secondary py-5">該当する社員はいません。</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center">
      <span class="small text-secondary" th:text="|${employees.totalElements}件中 ${employees.totalElements == 0 ? 0 : employees.number * employees.size + 1}–${employees.number * employees.size + employees.numberOfElements}件|"></span>
      <nav aria-label="社員一覧ページ">
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item" th:classappend="${employees.first ? ' disabled' : ''}"><a class="page-link" th:href="@{/employees(page=${employees.number - 1},keyword=${keyword},departmentId=${departmentId},status=${selectedStatus})}">前へ</a></li>
          <li class="page-item disabled"><span class="page-link" th:text="|${employees.totalPages == 0 ? 0 : employees.number + 1} / ${employees.totalPages}|"></span></li>
          <li class="page-item" th:classappend="${employees.last ? ' disabled' : ''}"><a class="page-link" th:href="@{/employees(page=${employees.number + 1},keyword=${keyword},departmentId=${departmentId},status=${selectedStatus})}">次へ</a></li>
        </ul>
      </nav>
    </div>
  </section>
</main>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>

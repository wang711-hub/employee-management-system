<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navigation" class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/dashboard}">社員管理システム</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation"
            aria-controls="mainNavigation" aria-expanded="false" aria-label="ナビゲーションを開く">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavigation">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">ダッシュボード</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/employees}">社員一覧</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/departments}">部署管理</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/ai}">AIデータ照会</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3 text-white">
        <span class="small"><span th:text="${currentUsername}">user</span><span class="ms-2 opacity-75" th:text="${currentRole}">VIEWER</span></span>
        <form th:action="@{/logout}" method="post" class="m-0">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="btn btn-sm btn-outline-light">ログアウト</button>
        </form>
      </div>
    </div>
  </div>
</nav>
</body>
</html>

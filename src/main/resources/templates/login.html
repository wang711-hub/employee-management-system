<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | 社員管理システム</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
  <section class="card login-card shadow-sm border-0">
    <div class="card-body p-4 p-md-5">
      <p class="eyebrow">EMPLOYEE MANAGEMENT</p>
      <h1 class="h3 mb-4">社員管理システム</h1>
      <div class="alert alert-danger" role="alert" th:if="${param.error}">ユーザー名またはパスワードが正しくありません。</div>
      <div class="alert alert-success" role="alert" th:if="${param.logout}">ログアウトしました。</div>
      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
          <label for="username" class="form-label">ユーザー名</label>
          <input id="username" name="username" class="form-control" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">パスワード</label>
          <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">ログイン</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
